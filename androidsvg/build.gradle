apply plugin: "com.android.library"

android {
    compileSdkVersion 26

    defaultConfig {
        minSdkVersion     9
        targetSdkVersion 24
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.txt"
        }
    }

    dependencies {
        testImplementation "junit:junit:4.12"
        testImplementation "org.robolectric:robolectric:3.1" // RM -- Instead of 3.3.2
        testImplementation "com.google.truth:truth:0.34"     // to match hamcrest 1.3 from Robolectric
    }
}

